ldap_protocol: ldap
ldap_host: ldap
ldap_host_ip: 192.168.123.180
set_hosts: true
ldap_tls: true
ldap_searchbase: dc=example,dc=org
ldap_schema: rfc2307bis
usernames_case_sensitive: True
# Leave empty to auto-detect the SSH service name (`ssh` vs `sshd`).
# Set this explicitly in inventory/group_vars/host_vars if you want to override it.
ssh_service_name: ""

domain: example.org
install_ldapscripts: True

# This will allays remove user keyrings by using google chrome browser, because of erros popus on password changes
using_chrome: True
